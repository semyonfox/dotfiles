# hypridle: PC desktop idle daemon
# timeline when not inhibited by caffeine / browser fullscreen / etc:
#   10m lock screen (loginctl -> hyprlock-wrapper)
#   15m display off (dpms)
# no automatic suspend: PC sessions should stay reachable unless suspended manually.
# caffeine: ~/.local/share/bin/caffeine-toggle.sh uses systemd-inhibit, which hypridle honours.

general {
    lock_cmd = pidof hyprlock || /home/semyon/.local/share/bin/hyprlock-wrapper
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
