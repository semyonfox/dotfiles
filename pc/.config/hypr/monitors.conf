# Hyprland Monitor Configuration
# PC layout verified 2026-07-05.
# Keep the AOC ultrawide at 0x0 so portals/RustDesk treat it as the main screen.

monitor=desc:AOC CU34G2XP 1Q1S4HA000685,3440x1440@180.00,0x0,1,bitdepth,10,cm,srgb
monitor=desc:Microstep MSI G241 0x000002A7,1920x1080@60.00,3440x0,1,cm,srgb

# Default workspaces per monitor.
workspace=1,monitor:desc:AOC CU34G2XP 1Q1S4HA000685,default:true
workspace=2,monitor:desc:Microstep MSI G241 0x000002A7,default:true

# Fallback for unknown or virtual outputs. Put them after the physical displays so
# they do not become the 0x0/default output during screen capture.
monitor=,preferred,5360x0,1
