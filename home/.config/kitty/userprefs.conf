# Set your personal kitty configuration here
shell /usr/bin/zsh

# Enable true color (Kitty defaults to 256 color, this ensures full true color)
enable_true_color yes

# Terminfo for tmux compatibility
term xterm-256color

# transparent background — pairs with hyprland blur.
background_opacity 0.82
dynamic_background_opacity yes
confirm_os_window_close 0
