general {
    lock_cmd = /home/semyon/.local/share/bin/hyprlock-wrapper
    before_sleep_cmd = /home/semyon/.local/share/bin/hyprlock-wrapper
}

listener {
    timeout = 300
    on-timeout = /home/semyon/.local/share/bin/hyprlock-wrapper
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}