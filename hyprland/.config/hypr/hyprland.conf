$scrPath = $HOME/.local/share/bin # set scripts path


# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor = ,preferred,auto,auto


# █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hyprland.org/Configuring/Keywords/

exec-once = $scrPath/resetxdgportal.sh # reset XDPH for screenshare
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = $scrPath/polkitkdeauth.sh # authentication dialogue for GUI apps
exec-once = sh -lc 'grep -qx laptop /home/semyon/.config/dotfiles/machine-profile && command -v noctalia >/dev/null && exit 0; systemctl --user --quiet is-active waybar.service || pgrep -x waybar >/dev/null || { command -v waybar >/dev/null && waybar; }'
exec-once = blueman-applet # systray app for Bluetooth
exec-once = udiskie --no-automount --smart-tray # front-end that allows to manage removable media
exec-once = nm-applet --indicator # systray app for Network/Wifi
exec-once = sh -lc 'grep -qx laptop /home/semyon/.config/dotfiles/machine-profile && command -v noctalia >/dev/null && exit 0; systemctl --user --quiet is-active swaync.service || pgrep -x swaync >/dev/null || { command -v swaync >/dev/null && swaync; }'
# Yank handles clipboard history; keep cliphist inactive to avoid duplicate clipboard managers.
# exec-once = wl-paste --type text --watch cliphist store
# exec-once = wl-paste --type image --watch cliphist store
exec-once = sh -lc 'grep -qx laptop /home/semyon/.config/dotfiles/machine-profile && command -v noctalia >/dev/null && exit 0; $scrPath/hyprpaper-cycle.sh current' # start wallpaper daemon
exec-once = sh -lc 'compgen -G /sys/class/power_supply/BAT\* >/dev/null && [ -x "$HOME/.local/share/bin/batterynotify.sh" ] && "$HOME/.local/share/bin/batterynotify.sh"'
exec-once = ~/.local/bin/power-mode.sh auto # apply machine profile
exec-once = sh -lc 'grep -qx laptop /home/semyon/.config/dotfiles/machine-profile && command -v noctalia >/dev/null && exit 0; hypridle'
exec-once = playerctl daemon # playerctl daemon for media control


# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1
# Gaming & Proton environment fixes for Hyprland/Wayland
env = PROTON_LOG,0
env = WINE_CPU_TOPOLOGY,4:2
env = STAGING_SHARED_MEMORY,1
env = STEAM_RUNTIME_LAUNCH_DEBUG,0
env = SDL_VIDEODRIVER,wayland


# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

# See https://wiki.hyprland.org/Configuring/Variables/

input {
    kb_layout = us
    kb_model = pc105
    kb_rules = evdev
    follow_mouse = 1
    sensitivity = 0
    force_no_accel = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = yes
    }

}

# See https://wiki.hyprland.org/Configuring/Keywords/#executing

device {
    name = epic mouse V1
    sensitivity = -0.5
}

# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/

dwindle {
    preserve_split = yes
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/

master {
    new_status = master
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

# See https://wiki.hyprland.org/Configuring/Variables/

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}


# █▀ █▀█ █░█ █▀█ █▀▀ █▀▀
# ▄█ █▄█ █▄█ █▀▄ █▄▄ ██▄

source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
# Shared theme settings.
source = ~/.config/hypr/themes/common.conf
# hyprlang noerror true
# Theme specific settings.
source = ~/.config/hypr/themes/theme.conf
# hyprlang noerror false
# Wallbash color override.
source = ~/.config/hypr/themes/colors.conf
# Host-specific output config.
source = ~/.config/hypr/monitors.conf
# Host-specific user preferences.
source = ~/.config/hypr/userprefs.conf

# Note: as userprefs.conf is sourced at the end, settings configured in this file will override the defaults

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
