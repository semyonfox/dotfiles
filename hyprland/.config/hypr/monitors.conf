# Monitor configuration
# Uses 'preferred' to auto-select max resolution and refresh rate per monitor

# Laptop display - leftmost (auto-selects 1920x1200@60 max, with HiDPI scaling)
monitor = eDP-1, preferred, auto, 1.25

# External monitors - auto-select 1920x1080@165Hz max
monitor = DP-5, preferred@165, auto, 1.00
monitor = DP-6, preferred@165, auto, 1.00

# Fallback for any other monitors
monitor = , preferred, auto, 1.00

# Workspace to monitor pinning
# Workspace 1 on laptop, 2 on left external, 3 on right external
workspace = 1, monitor:eDP-1
workspace = 2, monitor:DP-5
workspace = 3, monitor:DP-6

# Workspaces 4+ are swappable (will use next available monitor if primary is full)
