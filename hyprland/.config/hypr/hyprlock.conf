general {
    hide_cursor = true
    grace = 0
}

auth {
    pam:enabled = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 2
    noise = 0.006
}

# time - upper third
label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(205, 214, 244, 0.95)
    font_size = 100
    font_family = Roboto
    position = 0, 350
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}

# date/day
label {
    text = cmd[update:1000] date +"%A %d %B"
    color = rgba(205, 214, 244, 0.6)
    font_size = 16
    font_family = Roboto
    position = 0, 280
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}

# quote - larger
label {
    text = cmd[update:0] shuf -n1 ~/.config/hypr/hyprlock-quotes.txt
    color = rgba(203, 166, 247, 0.7)
    font_size = 20
    font_family = Roboto
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}

# message
label {
    text = cmd[update:0] shuf -n1 ~/.config/hypr/hyprlock-messages.txt
    color = rgba(166, 227, 161, 0.9)
    font_size = 24
    font_family = Roboto
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}

# input field - slightly below middle
input-field {
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.5
    dots_center = true
    inner_color = rgba(30, 30, 50, 0.6)
    outer_color = rgba(137, 180, 250, 0.8)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = Enter password
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = Access denied. Skill issue detected.
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}

# now playing - bottom
label {
    text = cmd[update:1000] /home/semyon/.local/share/bin/hyprlock-nowplaying
    color = rgba(180, 190, 254, 0.7)
    font_size = 13
    font_family = Roboto
    position = 0, -300
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1.0)
    shadow_boost = 3.0
}
