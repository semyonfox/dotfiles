source = $HOME/.config/hypr/mocha.conf

$accent = $mauve

# switch keyboard layout while locked (same key as in hyprland)
bind = SUPER, K, exec, hyprctl switchxkblayout all next
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font Mono

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND — blurred screenshot of whatever is running
background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 7
  brightness = 0.8
  vibrancy = 0.15
  vibrancy_darkness = 0.0
}

animations {
  enabled = true
  bezier = easeOutQuint, 0.23, 1, 0.32, 1.0
  animation = inputFieldColors, 1, 3, easeOutQuint
  animation = inputFieldDots, 1, 3, easeOutQuint
  animation = fadeIn, 1, 5, easeOutQuint
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  rounding = -1
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}

# KEYBOARD LAYOUT
label {
  monitor =
  text =  $LAYOUT
  color = $subtext0
  font_size = 16
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# BATTERY
label {
  monitor =
  text = cmd[update:30000] ~/.config/hypr/Scripts/battery.sh
  color = $subtext0
  font_size = 16
  font_family = $font
  position = 0, 80
  halign = center
  valign = bottom
}

