# hypridle: idle daemon
# timeline on battery (when not inhibited by caffeine / browser fullscreen / etc):
#   4m  dim brightness to 10%
#   5m  lock screen (loginctl -> hyprlock-wrapper)
#   6m  display off (dpms)
#   30m suspend to ram
# on AC/external power: idle actions are skipped; laptop stays awake/unlocked.
# caffeine: ~/.local/share/bin/caffeine-toggle.sh uses systemd-inhibit, which hypridle honours.

general {
    lock_cmd = pidof hyprlock || /home/semyon/.local/share/bin/hyprlock-wrapper
    before_sleep_cmd = /home/semyon/.local/share/bin/hypridle-on-battery loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 240
    on-timeout = /home/semyon/.local/share/bin/hypridle-on-battery brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = /home/semyon/.local/share/bin/hypridle-on-battery loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = /home/semyon/.local/share/bin/hypridle-on-battery hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = /home/semyon/.local/share/bin/hypridle-on-battery systemctl suspend
}
