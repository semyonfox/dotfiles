# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

# power-mode keybinds (orchestrator at ~/.local/bin/power-mode.sh)
bind = SUPER, F10, exec, ~/.local/bin/power-mode.sh saver
bind = SUPER, F11, exec, ~/.local/bin/power-mode.sh ac
bind = SUPER, F12, exec, ~/.local/bin/power-mode.sh beast
bind = SUPER SHIFT, F12, exec, ~/.local/bin/power-mode.sh cycle

# everything that respects $TERMINAL should open in kitty
env = TERMINAL,kitty

# app launchers
unbind = Super, Space
bind = Super, Space, exec, /home/semyon/.local/bin/vicinae toggle
bind = Super, O, exec, obsidian
# Yank replaces the old cliphist shortcuts.
unbind = Super, V
unbind = Super+Shift, V
bind = Super, V, exec, /home/semyon/.local/bin/yank --palette
bind = Super+Shift, V, exec, /home/semyon/.local/bin/yank --palette
bind = Ctrl+Shift, Space, exec, /home/semyon/.local/bin/yank --palette
# super+c: claude code (cc alias needs interactive zsh)
unbind = SUPER, C
bind = SUPER, C, exec, kitty zsh -i -c 'cc; exec zsh'

# window transparency. focused nearly solid, unfocused noticeably see-through.
# fullscreen stays fully opaque so video/images aren't tinted.
decoration {
    active_opacity = 0.95
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0
    # subtle darken on unfocused windows — makes the focused one pop.
    dim_inactive = true
    dim_strength = 0.08
    dim_special = 0.3
}

# snappier, more premium animation curves.
bezier = snap, 0.25, 1, 0.5, 1
bezier = pop, 0.34, 1.56, 0.64, 1
animation = windows, 1, 3, pop
animation = windowsOut, 1, 3, snap, popin 90%
animation = fade, 1, 3, snap
animation = workspaces, 1, 3, snap, slide

# let kitty own its own transparency (avoids double-stacking with hyprland's).
# media/image apps stay fully opaque regardless of focus.
windowrule = opacity 1.0 override, match:class (kitty|mpv|vlc|imv|firefox|chromium|Brave-browser|zen|okular)

# blur for menus and notifications so they match the waybar vibe.
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = blur on, ignore_alpha 0, match:namespace vicinae
layerrule = no_anim on, match:namespace vicinae
