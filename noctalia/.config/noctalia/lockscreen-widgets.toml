# Seed for the lock screen layout made in the Noctalia editor.
# Noctalia pins every widget to a connector and saves the result to
# ~/.local/state/noctalia/settings.toml, which then wins over this file. So
# this only shapes a fresh host, or one whose [lockscreen_widgets] state was
# removed. Copy editor changes back here so a reset keeps them.
# A blank output means the first monitor, which is the laptop panel when it is
# open and the main screen on the pc. Positions are in a 1920x1080 frame and
# Noctalia rescales them to the real monitor.
# Login boxes are per output, so each host package adds its own in
# lockscreen-login.toml. There is no widget_order because Noctalia drops any
# widget it does not list, which would hide those host boxes.
[lockscreen_widgets]
enabled = true
schema_version = 2

[lockscreen_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[lockscreen_widgets.widget.lock-date]
type = "clock"
output = ""
cx = 960.0
cy = 152.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 500.0
box_height = 34.0
rotation = 0.0

[lockscreen_widgets.widget.lock-date.settings]
format = "{:%A, %B %-d}"
background = false

[lockscreen_widgets.widget.lock-clock]
type = "clock"
output = ""
cx = 960.0
cy = 214.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 500.0
box_height = 116.0
rotation = 0.0

[lockscreen_widgets.widget.lock-clock.settings]
format = "{:%H:%M}"
background = false

[lockscreen_widgets.widget.lock-visualizer]
type = "fancy_audio_visualizer"
output = ""
cx = 960.0
cy = 607.5
placement_width = 1920.0
placement_height = 1080.0
rotation = 0.0

[lockscreen_widgets.widget.lock-visualizer.settings]
background = false
bloom_intensity = 1.0
fade_when_idle = false
inner_diameter = 0.5
primary_color = "primary"
ring_opacity = 1.0
rotation_speed = 1.0
secondary_color = "secondary"
sensitivity = 1.0
visualization_mode = "all"
wave_thickness = 1.2

[lockscreen_widgets.widget.lock-media]
type = "media_player"
output = ""
cx = 960.0
cy = 780.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 368.0
box_height = 160.0
rotation = 0.0

[lockscreen_widgets.widget.lock-media.settings]
hide_when_no_media = true
layout = "horizontal"
shadow = true
