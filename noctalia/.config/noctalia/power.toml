# Map Noctalia profiles to Beast, source-aware AC/Mobile, and Saver. PPD owns
# governor, EPP, and platform profile; the helper adds EPB and charge limits.
[hooks]
power_profile_changed = "/home/semyon/.local/bin/power-mode.sh noctalia \"$NOCTALIA_POWER_PROFILE\" \"$NOCTALIA_POWER_PROFILE_ORIGIN\""
