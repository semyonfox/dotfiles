# Calm, Mac-like lock surface: blurred current desktop, restrained dark tint.
[lockscreen]
enabled = true
fingerprint = true
blurred_desktop = true
blur_intensity = 0.60
tint_intensity = 0.38
# lock natively on lid close, power key and systemctl suspend
lock_before_suspend = true
# no monitors list, so every screen gets the lock UI and its own login box
