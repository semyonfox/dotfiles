# Calm, Mac-like lock surface: blurred current desktop, restrained dark tint.
[lockscreen]
enabled = true
fingerprint = true
blurred_desktop = true
blur_intensity = 0.60
tint_intensity = 0.38
# Show the lock UI only on the laptop panel and blank other displays. When
# eDP-1 is absent (lid closed, or the pc) Noctalia ignores this and uses all.
monitors = ["eDP-1"]
